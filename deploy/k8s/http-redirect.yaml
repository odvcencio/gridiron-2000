# Redirect plain HTTP to HTTPS. The main ingress serves TLS only, so
# without this a manager who types the bare hostname over HTTP gets a
# traefik 404. The middleware reference format is
# "<namespace>-<middleware-name>@kubernetescrd".
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: gridiron
  labels:
    app: gridiron-2000
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gridiron-2000-http
  namespace: gridiron
  labels:
    app: gridiron-2000
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: gridiron-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gridiron.draco.quest
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gridiron-2000
                port:
                  name: http
