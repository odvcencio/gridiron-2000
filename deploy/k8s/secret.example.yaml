# Template only. Copy this file, fill in real values, and apply the copy —
# never commit the filled-in version. See docs/launch-checklist.md for the
# exact commands, including how to generate SESSION_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: gridiron-2000-secrets
  namespace: gridiron
  labels:
    app: gridiron-2000
type: Opaque
stringData:
  SESSION_SECRET: "replace-with-openssl-rand-base64-48-output"
  GOOGLE_CLIENT_ID: "replace-with-google-oauth-client-id"
  GOOGLE_CLIENT_SECRET: "replace-with-google-oauth-client-secret"
  GOOGLE_REDIRECT_URL: "https://league.example.com/auth/google/callback"
  # One email per seat; match the count to your league.json's teams[].
  # Ordinary manager identities belong in this list. An explicit alias for the
  # configured commissioner is admitted by the narrow commissioner exception.
  LEAGUE_ALLOWED_EMAILS: "manager1@example.com,manager2@example.com,manager3@example.com,commissioner.alias@example.org,commissioner@example.com"
  DATA_API_TOKEN: "replace-with-a-random-export-token"
  # Shared only by explicitly federated league instances. It authorizes the
  # PII-free read-only commissioner summary, never exports or mutations.
  COMMISSIONER_HQ_TOKEN: "replace-with-a-separate-random-federation-token"
  # Canonical commissioner identity. Its explicit aliases are admitted by the
  # narrow commissioner exception; unrelated aliases still need raw policy.
  COMMISSIONER_EMAILS: "commissioner@example.com"
  IDENTITY_ALIASES: "commissioner.alias@example.org=commissioner@example.com"
