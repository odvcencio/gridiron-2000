# gridiron-backup: the Kubernetes ServiceAccount deployment.yaml's
# gridiron-2000 pod runs as (serviceAccountName), and the Workload
# Identity Federation (WIF) principal Google Cloud trusts. Its own
# projected token (a short-lived, audience-scoped JWT — see
# deployment.yaml's gcp-wif volume) is what the WIF provider exchanges
# for a federated GCP token, which then impersonates the "gridiron-backup"
# uploader service account in project bookt-cc (already provisioned with
# roles/storage.objectCreator on gs://m31labs-gridiron-backups only — see
# docs/backup-restore.md's "Google Cloud Storage" section for its exact
# email) for the actual upload. This object carries no GCP-side annotation itself
# (unlike GKE's own Workload Identity): the trust is anchored entirely on
# the GCP side, in the WIF provider's attribute mapping and the pool's
# allowed principal set, both provisioned out of band.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gridiron-backup
  namespace: gridiron
  labels:
    app: gridiron-2000
