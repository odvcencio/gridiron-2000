# Cluster conventions this manifest matches (read from the live cluster on
# 2026-08-15): ingressClassName "traefik" (every real ingress on this
# cluster uses traefik, not the also-installed "nginx" IngressClass), the
# cert-manager.io/cluster-issuer: cloudflare-issuer ClusterIssuer (issues
# through Cloudflare DNS-01, so the certificate can be ready before the
# public DNS record exists), and a short "<app>-tls" TLS secret name as
# used by the other draco.quest apps (blog-tls, for example).
# Replace the host below to serve the league from a different name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gridiron-2000
  namespace: gridiron
  labels:
    app: gridiron-2000
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: gridiron.draco.quest
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gridiron-2000
                port:
                  name: http
  tls:
    - hosts:
        - gridiron.draco.quest
      secretName: gridiron-2000-tls
