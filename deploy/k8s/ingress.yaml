# Example Traefik ingress. Choose your own hostname, certificate issuer,
# TLS Secret, and ingress class in the private operator manifest.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gridiron-2000
  namespace: gridiron
  labels:
    app: gridiron-2000
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: gridiron-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: league.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gridiron-2000
                port:
                  name: http
  tls:
    - hosts:
        - league.example.com
      secretName: gridiron-2000-tls
