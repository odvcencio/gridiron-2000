# Example single-instance storage. Choose an appropriate StorageClass in
# your private manifest and verify its backup and reclaim behavior.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gridiron-2000-data
  namespace: gridiron
  labels:
    app: gridiron-2000
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
