# Template only. Copy this file, fill in real values, and apply the copy —
# never commit the filled-in version. Mirrors ../secret.example.yaml. No
# TANK01_API_KEY here: SK points TANK01_BASE_URL at the shared statrelay
# relay (deployment.yaml), so only statrelay-secrets (in the gridiron
# namespace) needs a real Tank01 key.
#
# LEAGUE_ALLOWED_EMAILS is likely unnecessary for SK: membership.
# allowed_domain in league-sk.json already admits any @stablekernel.com
# sign-in without an invite-list entry (config.go's EmailAllowed — the
# domain gate and the invite list are additive, not exclusive). Set this
# only if SK also wants to invite specific non-domain guests.
apiVersion: v1
kind: Secret
metadata:
  name: gridiron-2000-sk-secrets
  namespace: stablekernel
  labels:
    app: gridiron-2000-sk
type: Opaque
stringData:
  SESSION_SECRET: "replace-with-openssl-rand-base64-48-output"
  GOOGLE_CLIENT_ID: "replace-with-google-oauth-client-id"
  GOOGLE_CLIENT_SECRET: "replace-with-google-oauth-client-secret"
  GOOGLE_REDIRECT_URL: "https://sk.gridiron.draco.quest/auth/google/callback"
  LEAGUE_ALLOWED_EMAILS: ""
  DATA_API_TOKEN: "replace-with-a-random-export-token"
  COMMISSIONER_HQ_TOKEN: "replace-with-the-same-separate-federation-token"
  COMMISSIONER_EMAILS: "oscar.villavicencio@stablekernel.com"
