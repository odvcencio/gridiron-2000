# Mirrors ../ingress.yaml's cluster conventions: ingressClassName
# "traefik", cert-manager.io/cluster-issuer: cloudflare-issuer (DNS-01
# through Cloudflare, so the certificate can be ready before the public DNS
# record exists), and a short "<app>-tls" TLS secret name.
#
# second.league.example.com is a placeholder. Configure your private hostname,
# DNS, certificate, OAuth callback, and league.url together; verify them before
# accepting a deployment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gridiron-2000-sk
  namespace: stablekernel
  labels:
    app: gridiron-2000-sk
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: stablekernel-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: second.league.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gridiron-2000-sk
                port:
                  name: http
  tls:
    - hosts:
        - second.league.example.com
      secretName: gridiron-2000-sk-tls
