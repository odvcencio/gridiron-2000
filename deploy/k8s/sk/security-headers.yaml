# Stable Kernel's namespaced copy of the HTTPS response policy. Keep HSTS
# host-only until every Gridiron subdomain is confirmed HTTPS-only. CSP waits
# for a GoSX nonce/hash contract because the navigation runtime is inline.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: stablekernel
  labels:
    app: gridiron-2000-sk
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: false
    stsPreload: false
    forceSTSHeader: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
