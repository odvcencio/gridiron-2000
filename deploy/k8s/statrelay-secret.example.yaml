# Template only. Copy this file, fill in the real key, and apply the copy
# — never commit the filled-in version. This is the ONLY place the real
# Tank01 key belongs once any league instance sets TANK01_BASE_URL to
# point at the relay: see deploy/README.md's "Shared Tank01 relay" section.
apiVersion: v1
kind: Secret
metadata:
  name: statrelay-secrets
  namespace: gridiron
  labels:
    app: statrelay
type: Opaque
stringData:
  TANK01_API_KEY: "replace-with-rapidapi-tank01-key"
  # Optional: only needed to point statrelay at a different Tank01 sport
  # host (NBA, MLB, NHL). Omit to use the NFL default (see cmd/statrelay's
  # defaultHost, mirroring internal/fantasy/model.go's DefaultHost).
  # TANK01_HOST: "tank01-nfl-live-in-game-real-time-statistics-nfl.p.rapidapi.com"
